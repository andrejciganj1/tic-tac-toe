<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#111">
<title>Tic Tac Toe</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, sans-serif;
    background: #111;
    color: #eee;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1.25rem;
    padding: 1rem;
    padding-bottom: max(1rem, env(safe-area-inset-bottom));
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
  }
  h1 { font-size: 1.25rem; font-weight: 600; letter-spacing: 0.02em; }
  #status { font-size: 1rem; color: #aaa; min-height: 1.5em; }
  #board {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    width: min(84vw, 320px);
    aspect-ratio: 1;
  }
  .cell {
    background: #222;
    border: none;
    border-radius: 12px;
    color: #eee;
    font-size: clamp(2.5rem, 12vw, 3.5rem);
    font-weight: 700;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .cell:active:not(:disabled) { background: #2a2a2a; }
  .cell:disabled { cursor: default; }
  .cell.win { background: #1a3d2a; color: #6f6; }
  #reset {
    margin-top: 0.25rem;
    background: #333;
    color: #eee;
    border: none;
    border-radius: 999px;
    padding: 0.75rem 1.5rem;
    font-size: 1rem;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  #reset:active { background: #444; }
</style>
</head>
<body>
  <h1>Tic Tac Toe</h1>
  <p id="status">X's turn</p>
  <div id="board"></div>
  <button id="reset" type="button">New game</button>
<script>
const wins = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
let board, turn, over;
const status = document.getElementById('status');
const boardEl = document.getElementById('board');

function start() {
  board = Array(9).fill('');
  turn = 'X';
  over = false;
  status.textContent = "X's turn";
  boardEl.innerHTML = '';
  for (let i = 0; i < 9; i++) {
    const b = document.createElement('button');
    b.className = 'cell';
    b.type = 'button';
    b.setAttribute('aria-label', 'Cell ' + (i + 1));
    b.onclick = () => play(i, b);
    boardEl.appendChild(b);
  }
}

function play(i, btn) {
  if (over || board[i]) return;
  board[i] = turn;
  btn.textContent = turn;
  btn.disabled = true;
  const line = wins.find(w => w.every(j => board[j] === turn));
  if (line) {
    over = true;
    status.textContent = turn + ' wins';
    line.forEach(j => boardEl.children[j].classList.add('win'));
    return;
  }
  if (board.every(Boolean)) {
    over = true;
    status.textContent = 'Draw';
    return;
  }
  turn = turn === 'X' ? 'O' : 'X';
  status.textContent = turn + "'s turn";
}

document.getElementById('reset').onclick = start;
start();
</script>
</body>
</html>
