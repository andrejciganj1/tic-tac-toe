<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#111">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<title>Tic Tac Toe 4×4×4</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { background: #111; }
  body {
    font-family: system-ui, sans-serif;
    background: #111;
    color: #eee;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.4rem;
    padding: 0.75rem 0.75rem max(0.75rem, env(safe-area-inset-bottom));
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
  }
  h1 { font-size: 1.15rem; font-weight: 600; letter-spacing: 0.02em; }
  #mode { font-size: 0.75rem; color: #777; min-height: 1.1em; }
  #status { font-size: 1rem; color: #aaa; min-height: 1.5em; }
  #stage { position: relative; flex: 1 1 0; min-height: 300px; width: 100%; max-width: 480px; }
  #cube {
    position: absolute;
    left: 0;
    top: 0;
    touch-action: none;
    cursor: grab;
    border-radius: 12px;
    background: #181818;
  }
  #hint { font-size: 0.75rem; color: #666; text-align: center; max-width: 480px; }
  #new {
    background: #333;
    color: #eee;
    border: none;
    border-radius: 999px;
    padding: 0.6rem 1.5rem;
    font-size: 1rem;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  #new:active { background: #444; }
  #sheet { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; justify-content: flex-end; }
  #sheet[hidden] { display: none; }
  #sheet-backdrop { position: absolute; inset: 0; background: rgba(0,0,0,0.6); }
  #sheet-panel {
    position: relative;
    width: 100%;
    max-width: 480px;
    margin: 0 auto;
    background: #1e1e1e;
    border-radius: 16px 16px 0 0;
    padding: 1rem 1rem max(1rem, env(safe-area-inset-bottom));
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
  }
  #sheet-panel h2 { font-size: 0.9rem; font-weight: 600; color: #aaa; text-align: center; margin-bottom: 0.25rem; }
  #sheet-panel button {
    background: #2c2c2c;
    color: #eee;
    border: 1px solid transparent;
    border-radius: 12px;
    padding: 0.8rem 1rem;
    font-size: 1rem;
    text-align: left;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 0.5rem;
    -webkit-tap-highlight-color: transparent;
  }
  #sheet-panel button:active { background: #3a3a3a; }
  #sheet-panel button.last { border-color: #3c96ff; }
  #sheet-panel small { font-size: 0.7rem; color: #888; font-weight: 400; }
  #sheet-panel button.last small.mark { color: #7fb8ff; }
</style>

<body>
  <h1>Tic Tac Toe 4×4×4</h1>
  <p id="mode"></p>
  <p id="status"></p>
  <div id="stage"><canvas id="cube"></canvas></div>
  <p id="hint">Drag to rotate · tap a number to pick a layer · tap a cube, then tap again to place</p>
  <button id="new" type="button">New game</button>
  <div id="sheet" hidden>
    <div id="sheet-backdrop"></div>
    <div id="sheet-panel" role="dialog" aria-label="Choose game mode">
      <h2>New game</h2>
      <button type="button" data-mode="pvp"><span>2 players</span><small>same phone</small></button>
      <button type="button" data-mode="easy"><span>vs Computer: Easy</span></button>
      <button type="button" data-mode="medium"><span>vs Computer: Medium</span></button>
      <button type="button" data-mode="hard"><span>vs Computer: Hard</span></button>
    </div>
  </div>
<script id="rules">
(() => {
  const Q = globalThis.Qubic = globalThis.Qubic || {};
  const idx = (l, r, c) => l * 16 + r * 4 + c;

  // Every line of 4 cells: each direction in {-1,0,1}^3 (not zero), each start where 4 cells fit.
  const LINES = [], seen = new Set();
  for (let dl = -1; dl <= 1; dl++) for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
    if (!dl && !dr && !dc) continue;
    for (let l = 0; l < 4; l++) for (let r = 0; r < 4; r++) for (let c = 0; c < 4; c++) {
      const el = l + 3 * dl, er = r + 3 * dr, ec = c + 3 * dc;
      if (el < 0 || el > 3 || er < 0 || er > 3 || ec < 0 || ec > 3) continue;
      const pts = [0, 1, 2, 3].map(k => idx(l + k * dl, r + k * dr, c + k * dc));
      const key = [...pts].sort((a, b) => a - b).join();
      if (!seen.has(key)) { seen.add(key); LINES.push(pts); }
    }
  }
  const LINES_AT = Array.from({ length: 64 }, () => []);
  LINES.forEach((L, n) => L.forEach(i => LINES_AT[i].push(n)));

  // A line through cell i whose 4 cells all match board[i], or null.
  function winningLine(board, i) {
    const p = board[i];
    if (!p) return null;
    for (const n of LINES_AT[i]) if (LINES[n].every(j => board[j] === p)) return LINES[n];
    return null;
  }
  const isFull = board => board.every(Boolean);
  const other = p => (p === 'X' ? 'O' : 'X');

  Object.assign(Q, { idx, LINES, LINES_AT, winningLine, isFull, other });
})();
</script>
<script id="controller">
(() => {
  const Q = globalThis.Qubic = globalThis.Qubic || {};
  const MODES = ['pvp', 'easy', 'medium', 'hard'];

  function fresh(s, mode) {
    s.mode = mode;
    s.board = Array(64).fill('');
    s.turn = 'X';
    s.activeLayer = 0;
    s.pending = -1;
    s.last = -1;
    s.winLine = null;
    s.over = false;
    s.thinking = false;
  }
  function createGame(mode) {
    const s = { gen: 0 };
    fresh(s, mode);
    return s;
  }
  function restart(s, mode) {
    const gen = s.gen + 1;
    fresh(s, mode);
    s.gen = gen;
  }
  function selectLayer(s, l) { s.activeLayer = l; s.pending = -1; }
  function clearSelection(s) { s.pending = -1; }

  // Puts the current player's piece on cell i, then sets win, draw or the next turn.
  function place(s, i) {
    s.board[i] = s.turn;
    s.last = i;
    s.pending = -1;
    const line = Q.winningLine(s.board, i);
    if (line) { s.winLine = line; s.over = true; return; }
    if (Q.isFull(s.board)) { s.over = true; return; }
    s.turn = Q.other(s.turn);
    if (s.mode !== 'pvp' && s.turn === 'O') s.thinking = true;
  }

  function tapCell(s, i) {
    if (s.over || s.thinking || s.board[i] || Math.floor(i / 16) !== s.activeLayer) return 'ignored';
    if (s.pending !== i) { s.pending = i; return 'selected'; }
    place(s, i);
    return 'placed';
  }
  function applyComputerMove(s, i, gen) {
    if (!s.thinking || gen !== s.gen || s.board[i]) return false;
    s.thinking = false;
    place(s, i);
    return true;
  }

  function statusText(s) {
    const pvp = s.mode === 'pvp';
    if (s.over) {
      if (!s.winLine) return 'Draw';
      return pvp ? s.turn + ' wins' : (s.turn === 'X' ? 'You win' : 'Computer wins');
    }
    if (s.thinking) return 'Computer is thinking\u2026';
    if (s.pending >= 0) return (pvp ? s.turn : 'You') + ': tap again to place';
    return (pvp ? s.turn + "'s turn" : 'Your turn') + ' \u00b7 layer ' + (s.activeLayer + 1);
  }
  function modeLabel(mode) {
    return { pvp: '2 players', easy: 'vs Computer \u00b7 Easy', medium: 'vs Computer \u00b7 Medium', hard: 'vs Computer \u00b7 Hard' }[mode];
  }
  function parseSavedMode(value) { return MODES.includes(value) ? value : null; }

  Object.assign(Q, { MODES, createGame, restart, selectLayer, clearSelection, tapCell, applyComputerMove, statusText, modeLabel, parseSavedMode });
})();
</script>
<script id="ai">
(() => {
  const Q = globalThis.Qubic = globalThis.Qubic || {};
  const { LINES, LINES_AT, other } = Q;

  // Deterministic generator (mulberry32) so tests can fix the seed.
  function makeRng(seed) {
    let a = seed >>> 0;
    return () => {
      a = (a + 0x6D2B79F5) >>> 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // Empty cells that would complete a line for p, ascending.
  function threatCells(board, p) {
    const out = [];
    for (let i = 0; i < 64; i++) {
      if (board[i]) continue;
      if (LINES_AT[i].some(n => {
        let own = 0;
        for (const j of LINES[n]) if (board[j] === p) own++;
        return own === 3;
      })) out.push(i);
    }
    return out;
  }

  // Heuristic value of playing cell i as me (shared by all levels).
  const OWN = [1, 3, 12], OPP = [0, 2, 9];
  function cellScore(board, i, me) {
    const opp = other(me);
    let s = 0;
    for (const n of LINES_AT[i]) {
      let mine = 0, theirs = 0;
      for (const j of LINES[n]) { if (board[j] === me) mine++; else if (board[j] === opp) theirs++; }
      if (!theirs) s += OWN[mine];
      if (!mine) s += OPP[theirs];
    }
    return s;
  }

  const emptyCells = board => { const e = []; for (let i = 0; i < 64; i++) if (!board[i]) e.push(i); return e; };
  const pickOne = (list, rng) => list[Math.floor(rng() * list.length)];

  // Empty cells after which p has two or more distinct completing cells.
  function forkCells(board, p) {
    const out = [];
    for (const i of emptyCells(board)) {
      board[i] = p;
      const n = threatCells(board, p).length;
      board[i] = '';
      if (n >= 2) out.push(i);
    }
    return out;
  }

  // Highest-scoring cells of `cells` (all ties), best first.
  function bestByScore(board, cells, me) {
    let best = -1, top = [];
    for (const i of cells) {
      const s = cellScore(board, i, me);
      if (s > best) { best = s; top = [i]; } else if (s === best) top.push(i);
    }
    return top;
  }

  // Steps shared by every level: win, then block. Returns a cell or -1.
  function winOrBlock(board, me) {
    const win = threatCells(board, me);
    if (win.length) return win[0];
    const block = threatCells(board, other(me));
    return block.length ? block[0] : -1;
  }

  // Medium's extra steps: make a fork, else stop the opponent's. Returns a cell or -1.
  function forkStep(board, me, rng) {
    const mine = forkCells(board, me);
    if (mine.length) return pickOne(bestByScore(board, mine, me), rng);
    const theirs = forkCells(board, other(me));
    return theirs.length ? pickOne(bestByScore(board, theirs, me), rng) : -1;
  }

  function easyMove(board, me, rng) {
    const m = winOrBlock(board, me);
    if (m >= 0) return m;
    const ranked = emptyCells(board)
      .map(i => ({ i, s: cellScore(board, i, me) }))
      .sort((a, b) => b.s - a.s || a.i - b.i)
      .slice(0, 5);
    return pickOne(ranked, rng).i;
  }

  function mediumMove(board, me, rng) {
    let m = winOrBlock(board, me);
    if (m >= 0) return m;
    m = forkStep(board, me, rng);
    if (m >= 0) return m;
    return pickOne(bestByScore(board, emptyCells(board), me), rng);
  }

  // Hard: forced-chain search. A chain is a run of own moves that each make exactly one threat,
  // each answered by the forced block, ending in a fork. The search keeps its own board and
  // per-line piece counts in typed arrays, updating only the lines through a cell as it is set
  // and unset. Sides are 1 (X) and 2 (O) inside the search.
  const MAX_CHAIN = 8, NL = LINES.length, SIDE = { X: 1, O: 2 };
  // Node budget per ms of the deadline: keeps play reproducible on fast machines, while the
  // deadline still stops the search on slow ones.
  const NODES_PER_MS = 1000;
  const LINE_CELLS = Int8Array.from(LINES.flat());
  const AT_START = new Int16Array(65), AT = new Int16Array(NL * 4);
  for (let i = 0, k = 0; i < 64; i++) { AT_START[i] = k; for (const n of LINES_AT[i]) AT[k++] = n; AT_START[i + 1] = k; }
  // Zobrist keys: halves 1 and 2 at (side * 64 + cell) and ((side + 3) * 64 + cell); the unused
  // slots ZOB[side] and ZOB[192 + side] mark whose chain a remembered result is for.
  const ZOB = (() => { const r = makeRng(0x51ab1c); return Int32Array.from({ length: 6 * 64 }, () => Math.floor(r() * 4294967296)); })();
  const TT_SIZE = 1 << 16;

  // Search state over a copy of board. Each search call takes a limit { time, nodes }.
  function chainSearch(board, now) {
    const cell = new Int8Array(64), cnt = [null, new Uint8Array(NL), new Uint8Array(NL)];
    const mark = new Int32Array(64), weight = new Int32Array(64);
    const cand = Array.from({ length: MAX_CHAIN }, () => new Int8Array(64));
    const blocks = Array.from({ length: MAX_CHAIN }, () => new Int8Array(64));
    // Remembered results by position: depth searched without a chain, or depth * 64 + first move of one.
    const tk1 = new Int32Array(TT_SIZE), tk2 = new Int32Array(TT_SIZE);
    const tFail = new Int8Array(TT_SIZE), tWin = new Int16Array(TT_SIZE);
    const killer = new Int8Array(MAX_CHAIN).fill(-1); // last winning move per ply
    let h1 = 0, h2 = 0, stamp = 0, nodes = 0, stopTime = 0, stopNodes = 0, out = false, cut = false;

    function begin(limit) { stopTime = limit.time; stopNodes = limit.nodes; out = false; }
    function set(i, p) {
      cell[i] = p; h1 ^= ZOB[p * 64 + i]; h2 ^= ZOB[(p + 3) * 64 + i];
      const c = cnt[p];
      for (let k = AT_START[i], e = AT_START[i + 1]; k < e; k++) c[AT[k]]++;
    }
    function unset(i, p) {
      cell[i] = 0; h1 ^= ZOB[p * 64 + i]; h2 ^= ZOB[(p + 3) * 64 + i];
      const c = cnt[p];
      for (let k = AT_START[i], e = AT_START[i + 1]; k < e; k++) c[AT[k]]--;
    }
    for (let i = 0; i < 64; i++) if (board[i]) set(i, SIDE[board[i]]);

    function emptyOf(n) {
      for (let k = n * 4; k < n * 4 + 4; k++) if (!cell[LINE_CELLS[k]]) return LINE_CELLS[k];
      return -1;
    }
    // p's completing cells on lines through i: -1 none, the cell if exactly one, -2 if two or more.
    function threatAt(i, p, q) {
      const cp = cnt[p], cq = cnt[q];
      let a = -1;
      for (let k = AT_START[i], e = AT_START[i + 1]; k < e; k++) {
        const n = AT[k];
        if (cp[n] !== 3 || cq[n]) continue;
        const j = emptyOf(n);
        if (a < 0) a = j; else if (j !== a) return -2;
      }
      return a;
    }
    // Same over the whole board.
    function allThreats(p, q) {
      const cp = cnt[p], cq = cnt[q];
      let a = -1;
      for (let n = 0; n < NL; n++) {
        if (cp[n] !== 3 || cq[n]) continue;
        const j = emptyOf(n);
        if (a < 0) a = j; else if (j !== a) return -2;
      }
      return a;
    }
    // Empty cells where p would make a threat, written to buf, cells on more open twos first.
    // Returns how many.
    function threatMoves(p, q, buf) {
      const cp = cnt[p], cq = cnt[q];
      let m = 0;
      stamp++;
      for (let n = 0; n < NL; n++) {
        if (cp[n] !== 2 || cq[n]) continue;
        for (let k = n * 4; k < n * 4 + 4; k++) {
          const j = LINE_CELLS[k];
          if (cell[j]) continue;
          if (mark[j] !== stamp) { mark[j] = stamp; weight[j] = 0; buf[m++] = j; }
          weight[j]++;
        }
      }
      for (let a = 1; a < m; a++) { // insertion sort, heaviest first
        const j = buf[a];
        let b = a - 1;
        while (b >= 0 && weight[buf[b]] < weight[j]) { buf[b + 1] = buf[b]; b--; }
        buf[b + 1] = j;
      }
      return m;
    }

    // Can p (to move, no threat of its own) force a fork within depth own moves? q has no threat
    // except `forced`, a cell p must take (-1 if none). On success the chain is pushed to path in
    // reverse, cut short where a remembered chain is reused. Sets out when the limit is reached.
    function attack(p, q, forced, depth, path, ply) {
      if ((++nodes & 63) === 0 && (nodes >= stopNodes || now() >= stopTime)) out = true;
      if (out) return false;
      const k1 = h1 ^ ZOB[p], k2 = h2 ^ ZOB[192 + p], e = (k1 ^ (k2 >>> 15)) & (TT_SIZE - 1);
      const known = tk1[e] === k1 && tk2[e] === k2;
      if (known && tWin[e] && (tWin[e] >> 6) <= depth) { path.push(tWin[e] & 63); return true; }
      const cs = cand[ply], ts = blocks[ply];
      let m;
      if (forced >= 0) { cs[0] = forced; m = 1; } else m = threatMoves(p, q, cs);
      let singles = 0; // moves making exactly one threat, compacted to the front of cs (block in ts)
      for (let a = 0; a < m; a++) {
        const c = cs[a];
        set(c, p);
        const t = threatAt(c, p, q);
        unset(c, p);
        if (t === -2) { path.push(c); return true; }
        if (t < 0) continue;
        if (c === killer[ply] && singles) { cs[singles] = cs[0]; ts[singles] = ts[0]; cs[0] = c; ts[0] = t; }
        else { cs[singles] = c; ts[singles] = t; }
        singles++;
      }
      if (!singles) return false;
      if (depth <= 1 || (known && tFail[e] >= depth)) { cut = true; return false; }
      for (let a = 0; a < singles; a++) {
        const c = cs[a], t = ts[a];
        set(c, p); set(t, q);
        const f = threatAt(t, q, p); // the block may threaten in turn
        const ok = f !== -2 && attack(p, q, f, depth - 1, path, ply + 1);
        unset(t, q); unset(c, p);
        if (ok) {
          path.push(t, c); killer[ply] = c;
          if (!known) { tk1[e] = k1; tk2[e] = k2; tFail[e] = 0; }
          tWin[e] = depth * 64 + c;
          return true;
        }
        if (out) return false;
      }
      if (!known) { tk1[e] = k1; tk2[e] = k2; tWin[e] = 0; }
      tFail[e] = depth;
      return false;
    }

    // side's forced chain from the current position, as if side were to move: the cells in play
    // order (from the first move), null if there is none within MAX_CHAIN, undefined if the limit
    // was reached first.
    function findChain(side, limit) {
      const p = SIDE[side], q = 3 - p;
      begin(limit);
      const win = allThreats(p, q);
      if (win !== -1) return win >= 0 ? [win] : [];
      const forced = allThreats(q, p);
      if (forced === -2) return null;
      for (let d = 1; d <= MAX_CHAIN; d++) { // iterative deepening finds the shortest chain
        const path = [];
        cut = false;
        if (attack(p, q, forced, d, path, 0)) return path.reverse();
        if (out) return undefined;
        if (!cut) return null; // nothing was cut off by depth, so deeper search finds nothing new
      }
      return null;
    }

    // With p (me) just set on a quiet c: would me, moving again, have a chain? Undefined at the limit.
    function setsUp(c, me, limit) {
      if (threatAt(c, SIDE[me], 3 - SIDE[me]) !== -1) return false;
      const chain = findChain(me, limit);
      return chain === undefined ? undefined : !!(chain && chain.length);
    }

    // With p just set on c, making a single threat blocked at f: does q still have a chain
    // within depth? A block that threatens in turn continues q's chain; a quiet block counts as
    // q's free move, so p's threat must not be spent on a defence that leaves q a chain anyway.
    function threatLoses(f, p, q, depth) {
      set(f, q);
      const g = threatAt(f, q, p);
      let lost;
      if (g === -1) lost = attack(q, p, -1, depth, [], 0);
      else { unset(f, q); return g === -2 || attack(q, p, f, depth, [], 0); }
      unset(f, q);
      return lost;
    }

    // A cell for me after which opp has no chain, deepening over candidates in the given order and
    // stopping early at a safe cell that also sets up a chain of my own. If every cell loses, the
    // first one that held out longest, provided opp then needs at least minDepth own moves;
    // otherwise -1. At the limit, the first safe cell, else the longest holder found so far.
    function defend(me, candidates, minDepth, limit) {
      const p = SIDE[me], q = 3 - p;
      let survivors = candidates, best = -1, bestDepth = 0, safe = -1;
      const fallback = () => (safe >= 0 ? safe : bestDepth >= minDepth ? best : -1);
      for (let d = 1; d <= MAX_CHAIN && survivors.length; d++) {
        const next = [];
        for (const c of survivors) {
          begin(limit);
          cut = false;
          set(c, p);
          const f = threatAt(c, p, q);
          const lost = f >= 0 ? threatLoses(f, p, q, d) : f === -1 && attack(q, p, -1, d, [], 0);
          const proven = !out && !lost && (!cut || d === MAX_CHAIN);
          const bonus = proven && setsUp(c, me, limit);
          unset(c, p);
          if (bonus) return c;
          if (out || bonus === undefined) return fallback();
          if (proven) { if (safe < 0) safe = c; } else if (!lost) next.push(c);
        }
        survivors = next;
        if (next.length) { best = next[0]; bestDepth = d; }
      }
      return fallback();
    }

    // The first quiet cell in candidates after which me, moving again, would have a chain; -1 if
    // none (or the limit was reached).
    function setUp(me, candidates, limit) {
      const p = SIDE[me];
      for (const c of candidates) {
        set(c, p);
        const r = setsUp(c, me, limit);
        unset(c, p);
        if (r === undefined) return -1;
        if (r) return c;
      }
      return -1;
    }

    // Cells where me would make a threat, as a plain array.
    function threatCellsOf(me) {
      const buf = new Int8Array(64), m = threatMoves(SIDE[me], 3 - SIDE[me], buf);
      return Array.from(buf.subarray(0, m));
    }

    return { findChain, defend, setUp, threatCellsOf };
  }

  function hardMove(board, me, rng, now, deadline) {
    // 1-2. Win, block, own fork (as medium).
    let m = winOrBlock(board, me);
    if (m >= 0) return m;
    const forks = forkCells(board, me);
    if (forks.length) return pickOne(bestByScore(board, forks, me), rng);
    // The searches share the time to the deadline (and the node budget): 35% for my chain, up to
    // 60% for spotting the opponent's, the rest for defence.
    const opp = other(me), t0 = now(), budget = deadline - t0, nodeBudget = Math.round(budget) * NODES_PER_MS;
    const limit = f => ({ time: t0 + budget * f, nodes: nodeBudget * f });
    const S = chainSearch(board, now);
    // 3. Own forced chain.
    const mine = S.findChain(me, limit(0.35));
    if (mine && mine.length) return mine[0];
    // 4. Defence: a cell after which the opponent has no chain.
    const theirs = S.findChain(opp, limit(0.6));
    const score = board.map((v, i) => (v ? -1 : cellScore(board, i, me)));
    const byScore = cells => cells.filter(i => !board[i]).sort((a, b) => score[b] - score[a] || a - b);
    if (theirs && theirs.length) {
      const order = [...new Set([...byScore(theirs), ...byScore(S.threatCellsOf(me)), ...byScore(emptyCells(board))])];
      m = S.defend(me, order, Math.ceil(theirs.length / 2), limit(1));
      if (m >= 0) return m;
    }
    // Extra step (wins far more often): a quiet cell after which I would have a chain.
    if (theirs !== undefined) {
      m = S.setUp(me, byScore(emptyCells(board)), limit(1));
      if (m >= 0) return m;
    }
    // 5. Medium's fork-block and best-score rules (also the answer when time runs out).
    return mediumMove(board, me, rng);
  }

  // Never mutates the caller's board (all levels work on a copy).
  function chooseMove(board, me, level, opts = {}) {
    const { rng = Math.random, now = () => performance.now(), deadline = now() + 150 } = opts;
    const work = board.slice();
    if (level === 'easy') return easyMove(work, me, rng);
    if (level === 'hard') return hardMove(work, me, rng, now, deadline);
    return mediumMove(work, me, rng);
  }

  Object.assign(Q, { makeRng, threatCells, forkCells, cellScore, chooseMove });
})();
</script>
<script id="geometry">
(() => {
  const Q = globalThis.Qubic = globalThis.Qubic || {};
  const HALF = 0.32, BADGE_R = 14, PERSPECTIVE = 10, PITCH_LIMIT = 1.3, TAP_SLOP = 8;

  function cellCenter(i) { return [(i % 4) - 1.5, 1.5 - Math.floor(i / 16), (Math.floor(i / 4) % 4) - 1.5]; }

  function makeCamera({ w, h, yaw, pitch }) {
    const ext = Math.hypot(1.5 + HALF, 1.5 + HALF, 1.5 + HALF);
    const scale = 1.2 * Math.min(w - 2 * (BADGE_R + 14), h) / 2 / ext;
    return { w, h, yaw, pitch, scale, cx: w / 2 + BADGE_R, cy: h / 2 };
  }

  // Yaw about the vertical axis first, then pitch.
  function rotate(cam, [x, y, z]) {
    const c1 = Math.cos(cam.yaw), s1 = Math.sin(cam.yaw), c2 = Math.cos(cam.pitch), s2 = Math.sin(cam.pitch);
    const x1 = x * c1 - z * s1, z1 = x * s1 + z * c1;
    return [x1, y * c2 - z1 * s2, y * s2 + z1 * c2];
  }

  function project(cam, v) {
    const [x, y, z] = rotate(cam, v), s = cam.scale * PERSPECTIVE / (PERSPECTIVE + z);
    return { X: cam.cx + x * s, Y: cam.cy - y * s, z, s };
  }

  function clampPitch(p) { return Math.max(-PITCH_LIMIT, Math.min(PITCH_LIMIT, p)); }

  function pickCell(hits, x, y) {
    let best = -1, bestD = Infinity;
    for (const h of hits) {
      const d = Math.hypot(x - h.X, y - h.Y);
      if (d <= h.r && d < bestD) { best = h.i; bestD = d; }
    }
    return best;
  }

  // Returns y positions indexed like the input; on screen, neighbours are at least gap apart, within [top, bottom] when they fit.
  function spreadBadges(ys, gap, top, bottom) {
    const out = ys.slice();
    const order = ys.map((_, k) => k).sort((a, b) => ys[a] - ys[b]);
    for (let k = 1; k < order.length; k++) out[order[k]] = Math.max(out[order[k]], out[order[k - 1]] + gap);
    const last = out[order[order.length - 1]];
    const shift = Math.max(0, last - bottom);
    for (let k = 0; k < out.length; k++) out[k] -= shift;
    const lift = Math.max(0, top - out[order[0]]);
    for (let k = 0; k < out.length; k++) out[k] += lift;
    return out;
  }

  Object.assign(Q, { HALF, BADGE_R, PERSPECTIVE, PITCH_LIMIT, TAP_SLOP, cellCenter, makeCamera, rotate, project, clampPitch, pickCell, spreadBadges });
})();
</script>
<script id="view">
(() => {
  const Q = globalThis.Qubic;
  const { HALF, BADGE_R, PERSPECTIVE, TAP_SLOP, cellCenter, makeCamera, rotate, project, clampPitch, pickCell, spreadBadges } = Q;
  const STORE_KEY = 'qubic.mode';
  let saved = null;
  try { saved = Q.parseSavedMode(localStorage.getItem(STORE_KEY)); } catch (_) {}
  const s = Q.createGame(saved || 'pvp');
  let lastMode = saved;
  const view = { yaw: -0.6, pitch: 0.45 };
  const cv = document.getElementById('cube'), stage = document.getElementById('stage'), ctx = cv.getContext('2d');
  let w = 0, h = 0, cam = null, hits = [], badges = [];

  // Unit-cube corners (bit 0 = x, bit 1 = y, bit 2 = z) and faces as corner cycles with normals.
  const CORNERS = [...Array(8)].map((_, b) => [b & 1 ? 1 : -1, b & 2 ? 1 : -1, b & 4 ? 1 : -1]);
  const FACES = [
    [[0, 2, 6, 4], [-1, 0, 0]], [[1, 3, 7, 5], [1, 0, 0]],
    [[0, 1, 5, 4], [0, -1, 0]], [[2, 3, 7, 6], [0, 1, 0]],
    [[0, 1, 3, 2], [0, 0, -1]], [[4, 5, 7, 6], [0, 0, 1]],
  ];
  const LIGHT = (() => { const v = [-0.35, 0.8, -0.5], n = Math.hypot(...v); return v.map(x => x / n); })();
  const RGB = { '': [190, 195, 210], X: [60, 150, 255], O: [255, 70, 70] };
  const EDGE = { X: 'rgba(170,215,255,0.9)', O: 'rgba(255,190,190,0.9)' };

  function voxel(i) {
    const v = s.board[i], ctr = cellCenter(i), act = Math.floor(i / 16) === s.activeLayer;
    const win = s.winLine && s.winLine.includes(i), sel = i === s.pending && !v;
    const pts = CORNERS.map(k => project(cam, [ctr[0] + k[0] * HALF, ctr[1] + k[1] * HALF, ctr[2] + k[2] * HALF]));
    const faces = FACES.map(([ix, n]) => {
      const rn = rotate(cam, n);
      return { q: ix.map(k => pts[k]), front: rn[2] < 0, light: 0.55 + 0.45 * Math.max(0, rn[0] * LIGHT[0] + rn[1] * LIGHT[1] + rn[2] * LIGHT[2]) };
    }).sort((a, b) => a.front - b.front);
    const fill = v ? 0.85 : sel ? 0.4 : act ? 0.12 : 0.025;
    const edge = win ? '#9f9' : sel ? EDGE[s.turn] : i === s.last ? '#fff' : v ? EDGE[v] : act ? 'rgba(255,255,255,0.45)' : 'rgba(255,255,255,0.07)';
    const rgb = sel ? RGB[s.turn] : RGB[v];
    ctx.setLineDash(sel ? [3, 2] : []);
    for (const f of faces) {
      if (v && !f.front) continue;
      ctx.beginPath(); f.q.forEach((pt, j) => j ? ctx.lineTo(pt.X, pt.Y) : ctx.moveTo(pt.X, pt.Y)); ctx.closePath();
      const [r, g, b] = rgb.map(x => Math.round(x * f.light));
      ctx.fillStyle = `rgba(${r},${g},${b},${fill})`; ctx.fill();
      ctx.lineWidth = win || sel ? 2 : i === s.last ? 1.6 : 1; ctx.strokeStyle = edge; ctx.stroke();
    }
    ctx.setLineDash([]);
    if (act && !v) { const c = project(cam, ctr); hits.push({ i, X: c.X, Y: c.Y, r: HALF * 1.6 * c.s }); }
  }

  // Layer numbers sit in a column on the left, each level with its layer's centre, pushed apart so they stay tappable.
  function placeBadges() {
    const ys = [0, 1, 2, 3].map(l => project(cam, [0, 1.5 - l, 0]).Y);
    const out = spreadBadges(ys, 2 * BADGE_R + 6, BADGE_R + 4, h - (BADGE_R + 4));
    return out.map((Y, l) => ({ l, X: BADGE_R + 6, Y }));
  }

  function draw() {
    if (!w) return;
    cam = makeCamera({ w, h, yaw: view.yaw, pitch: view.pitch });
    ctx.clearRect(0, 0, w, h);
    hits = [];
    const order = s.board.map((_, i) => ({ i, z: rotate(cam, cellCenter(i))[2] })).sort((a, b) => b.z - a.z);
    for (const { i } of order) voxel(i);
    if (s.winLine) {
      const a = project(cam, cellCenter(s.winLine[0])), b = project(cam, cellCenter(s.winLine[3]));
      ctx.strokeStyle = 'rgba(120,255,120,0.75)'; ctx.lineWidth = 3; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(a.X, a.Y); ctx.lineTo(b.X, b.Y); ctx.stroke();
    }
    badges = placeBadges();
    for (const b of badges) {
      const act = b.l === s.activeLayer;
      ctx.beginPath(); ctx.arc(b.X, b.Y, BADGE_R, 0, 7);
      ctx.fillStyle = act ? '#ddd' : '#2c2c2c'; ctx.fill();
      ctx.fillStyle = act ? '#111' : '#aaa'; ctx.font = '600 13px system-ui';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(b.l + 1, b.X, b.Y + 0.5);
    }
  }

  function render() {
    document.getElementById('mode').textContent = Q.modeLabel(s.mode);
    document.getElementById('status').textContent = Q.statusText(s);
    draw();
  }

  // Fills the stage (full width up to 480 px, the height that is left) and keeps the game state.
  function layout() {
    w = Math.floor(stage.clientWidth); h = Math.floor(stage.clientHeight);
    const dpr = window.devicePixelRatio || 1;
    cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
    cv.style.width = w + 'px'; cv.style.height = h + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    draw();
  }

  function tapAt(x, y) {
    let placed = false;
    let b = null, bd = BADGE_R + 6;
    for (const c of badges) { const d = Math.hypot(x - c.X, y - c.Y); if (d <= bd) { b = c; bd = d; } }
    if (b) Q.selectLayer(s, b.l);
    else {
      const i = pickCell(hits, x, y);
      if (i < 0) Q.clearSelection(s); else placed = Q.tapCell(s, i) === 'placed';
    }
    render();
    if (placed && s.thinking) scheduleComputer();
  }

  // The computer answers after a short pause; applyComputerMove drops the move if the game was restarted meanwhile.
  let computerTimer = 0;
  function scheduleComputer() {
    const gen = s.gen;
    clearTimeout(computerTimer);
    computerTimer = setTimeout(() => {
      let i = -1;
      try { i = Q.chooseMove(s.board, 'O', s.mode, { deadline: performance.now() + 150 }); } catch (_) {}
      if (!(i >= 0 && i < 64 && !s.board[i])) i = s.board.indexOf(''); // never stick on "thinking"
      Q.applyComputerMove(s, i, gen);
      render();
    }, 500);
  }

  const sheet = document.getElementById('sheet');
  function openSheet() {
    for (const b of sheet.querySelectorAll('button[data-mode]')) {
      const last = b.dataset.mode === lastMode;
      b.classList.toggle('last', last);
      const mark = b.querySelector('small.mark');
      if (last && !mark) { const m = document.createElement('small'); m.className = 'mark'; m.textContent = 'last played'; b.appendChild(m); }
      else if (!last && mark) mark.remove();
    }
    sheet.hidden = false;
  }
  function closeSheet() { sheet.hidden = true; }
  function pickMode(mode) {
    lastMode = mode;
    clearTimeout(computerTimer);
    try { localStorage.setItem(STORE_KEY, mode); } catch (_) {}
    Q.restart(s, mode);
    closeSheet();
    render();
  }

  // A press is a tap until it strays TAP_SLOP from where it started; after that it rotates for the rest of the press.
  // Only the first primary-button pointer counts; a second finger or a right click is ignored.
  let drag = null;
  cv.addEventListener('contextmenu', e => e.preventDefault());
  cv.addEventListener('pointerdown', e => {
    if (drag || !e.isPrimary || e.button !== 0) return;
    drag = { id: e.pointerId, sx: e.clientX, sy: e.clientY, x: e.clientX, y: e.clientY, rotating: false };
    try { cv.setPointerCapture(e.pointerId); } catch (_) {}
  });
  cv.addEventListener('pointermove', e => {
    if (!drag || e.pointerId !== drag.id) return;
    if (!drag.rotating) {
      if (Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) < TAP_SLOP) return;
      drag.rotating = true;
      cv.style.cursor = 'grabbing';
    }
    view.yaw += (e.clientX - drag.x) * 0.01;
    view.pitch = clampPitch(view.pitch + (e.clientY - drag.y) * 0.01);
    drag.x = e.clientX; drag.y = e.clientY; draw();
  });
  cv.addEventListener('pointerup', e => {
    if (!drag || e.pointerId !== drag.id) return;
    if (!drag.rotating) { const r = cv.getBoundingClientRect(); tapAt(e.clientX - r.left, e.clientY - r.top); }
    drag = null; cv.style.cursor = 'grab';
  });
  cv.addEventListener('pointercancel', e => { if (!drag || e.pointerId !== drag.id) return; drag = null; cv.style.cursor = 'grab'; });

  document.getElementById('new').onclick = openSheet;
  document.getElementById('sheet-backdrop').onclick = closeSheet;
  for (const b of sheet.querySelectorAll('button[data-mode]')) b.onclick = () => pickMode(b.dataset.mode);
  window.addEventListener('keydown', e => { if (e.key === 'Escape' && !sheet.hidden) closeSheet(); });
  window.addEventListener('resize', () => { layout(); });

  window.qubicTest = { state: s, tapAt, screenOf: i => project(cam, cellCenter(i)), badgeOf: l => badges[l] };
  render(); layout();
  if (!saved) openSheet();

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
</body>
</html>
