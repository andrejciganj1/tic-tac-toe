<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#111">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<title>Tic Tac Toe</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, sans-serif;
    background: #111;
    color: #eee;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1.25rem;
    padding: 1rem;
    padding-bottom: max(1rem, env(safe-area-inset-bottom));
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
  }
  h1 { font-size: 1.25rem; font-weight: 600; letter-spacing: 0.02em; }
  #status { font-size: 1rem; color: #aaa; min-height: 1.5em; }
  #board {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    width: min(84vw, 320px);
    aspect-ratio: 1;
  }
  .cell {
    background: #222;
    border: none;
    border-radius: 12px;
    color: #eee;
    font-size: clamp(2.5rem, 12vw, 3.5rem);
    font-weight: 700;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .cell:active:not(:disabled) { background: #2a2a2a; }
  .cell:disabled { cursor: default; }
  .cell.win { background: #1a3d2a; color: #6f6; }
  #reset {
    margin-top: 0.25rem;
    background: #333;
    color: #eee;
    border: none;
    border-radius: 999px;
    padding: 0.75rem 1.5rem;
    font-size: 1rem;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  #reset:active { background: #444; }
</style>
</head>
<body>
  <h1>Tic Tac Toe</h1>
  <p id="status">X's turn</p>
  <div id="board"></div>
  <button id="reset" type="button">New game</button>
<script id="rules">
(() => {
  const Q = globalThis.Qubic = globalThis.Qubic || {};
  const idx = (l, r, c) => l * 16 + r * 4 + c;

  // Every line of 4 cells: each direction in {-1,0,1}^3 (not zero), each start where 4 cells fit.
  const LINES = [], seen = new Set();
  for (let dl = -1; dl <= 1; dl++) for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
    if (!dl && !dr && !dc) continue;
    for (let l = 0; l < 4; l++) for (let r = 0; r < 4; r++) for (let c = 0; c < 4; c++) {
      const el = l + 3 * dl, er = r + 3 * dr, ec = c + 3 * dc;
      if (el < 0 || el > 3 || er < 0 || er > 3 || ec < 0 || ec > 3) continue;
      const pts = [0, 1, 2, 3].map(k => idx(l + k * dl, r + k * dr, c + k * dc));
      const key = [...pts].sort((a, b) => a - b).join();
      if (!seen.has(key)) { seen.add(key); LINES.push(pts); }
    }
  }
  const LINES_AT = Array.from({ length: 64 }, () => []);
  LINES.forEach((L, n) => L.forEach(i => LINES_AT[i].push(n)));

  // A line through cell i whose 4 cells all match board[i], or null.
  function winningLine(board, i) {
    const p = board[i];
    if (!p) return null;
    for (const n of LINES_AT[i]) if (LINES[n].every(j => board[j] === p)) return LINES[n];
    return null;
  }
  const isFull = board => board.every(Boolean);
  const other = p => (p === 'X' ? 'O' : 'X');

  Object.assign(Q, { idx, LINES, LINES_AT, winningLine, isFull, other });
})();
</script>
<script id="controller">
(() => {
  const Q = globalThis.Qubic = globalThis.Qubic || {};
  const MODES = ['pvp', 'easy', 'medium', 'hard'];

  function fresh(s, mode) {
    s.mode = mode;
    s.board = Array(64).fill('');
    s.turn = 'X';
    s.activeLayer = 0;
    s.pending = -1;
    s.last = -1;
    s.winLine = null;
    s.over = false;
    s.thinking = false;
  }
  function createGame(mode) {
    const s = { gen: 0 };
    fresh(s, mode);
    return s;
  }
  function restart(s, mode) {
    const gen = s.gen + 1;
    fresh(s, mode);
    s.gen = gen;
  }
  function selectLayer(s, l) { s.activeLayer = l; s.pending = -1; }
  function clearSelection(s) { s.pending = -1; }

  // Puts the current player's piece on cell i, then sets win, draw or the next turn.
  function place(s, i) {
    s.board[i] = s.turn;
    s.last = i;
    s.pending = -1;
    const line = Q.winningLine(s.board, i);
    if (line) { s.winLine = line; s.over = true; return; }
    if (Q.isFull(s.board)) { s.over = true; return; }
    s.turn = Q.other(s.turn);
    if (s.mode !== 'pvp' && s.turn === 'O') s.thinking = true;
  }

  function tapCell(s, i) {
    if (s.over || s.thinking || s.board[i] || Math.floor(i / 16) !== s.activeLayer) return 'ignored';
    if (s.pending !== i) { s.pending = i; return 'selected'; }
    place(s, i);
    return 'placed';
  }
  function applyComputerMove(s, i, gen) {
    if (!s.thinking || gen !== s.gen || s.board[i]) return false;
    s.thinking = false;
    place(s, i);
    return true;
  }

  function statusText(s) {
    const pvp = s.mode === 'pvp';
    if (s.over) {
      if (!s.winLine) return 'Draw';
      return pvp ? s.turn + ' wins' : (s.turn === 'X' ? 'You win' : 'Computer wins');
    }
    if (s.thinking) return 'Computer is thinking\u2026';
    if (s.pending >= 0) return (pvp ? s.turn : 'You') + ': tap again to place';
    return (pvp ? s.turn + "'s turn" : 'Your turn') + ' \u00b7 layer ' + (s.activeLayer + 1);
  }
  function modeLabel(mode) {
    return { pvp: '2 players', easy: 'vs Computer \u00b7 Easy', medium: 'vs Computer \u00b7 Medium', hard: 'vs Computer \u00b7 Hard' }[mode];
  }
  function parseSavedMode(value) { return MODES.includes(value) ? value : null; }

  Object.assign(Q, { MODES, createGame, restart, selectLayer, clearSelection, tapCell, applyComputerMove, statusText, modeLabel, parseSavedMode });
})();
</script>
<script>
const wins = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
let board, turn, over;
const status = document.getElementById('status');
const boardEl = document.getElementById('board');

function start() {
  board = Array(9).fill('');
  turn = 'X';
  over = false;
  status.textContent = "X's turn";
  boardEl.innerHTML = '';
  for (let i = 0; i < 9; i++) {
    const b = document.createElement('button');
    b.className = 'cell';
    b.type = 'button';
    b.setAttribute('aria-label', 'Cell ' + (i + 1));
    b.onclick = () => play(i, b);
    boardEl.appendChild(b);
  }
}

function play(i, btn) {
  if (over || board[i]) return;
  board[i] = turn;
  btn.textContent = turn;
  btn.disabled = true;
  const line = wins.find(w => w.every(j => board[j] === turn));
  if (line) {
    over = true;
    status.textContent = turn + ' wins';
    line.forEach(j => boardEl.children[j].classList.add('win'));
    return;
  }
  if (board.every(Boolean)) {
    over = true;
    status.textContent = 'Draw';
    return;
  }
  turn = turn === 'X' ? 'O' : 'X';
  status.textContent = turn + "'s turn";
}

document.getElementById('reset').onclick = start;
start();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
</html>
